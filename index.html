<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Game - Offline Ready</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #loading-screen {
            position: absolute; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #progress-bar-container { width: 60%; height: 8px; background: #333; border-radius: 4px; margin-top: 20px; }
        #progress-bar { width: 0%; height: 100%; background: #00ff00; border-radius: 4px; transition: width 0.3s; }
        #status { color: #00ff00; margin-top: 10px; font-size: 14px; }
        #game-ui { display: none; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }
        #knob { position: absolute; top: 40px; left: 40px; width: 40px; height: 40px; background: #fff; border-radius: 50%; }
        #jump-btn { position: absolute; bottom: 60px; right: 50px; width: 80px; height: 80px; background: rgba(0,0,0,0.5); color: white; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div id="status">INITIALIZING...</div>
        <div id="progress-bar-container"><div id="progress-bar"></div></div>
    </div>

    <div id="game-ui">
        <div id="joystick"><div id="knob"></div></div>
        <div id="jump-btn">JUMP</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        // অ্যাডন ফাইল সরাসরি পাথ দিয়ে ইমপোর্ট করছি যাতে এরর না হয়
        import { GLTFLoader } from './GLTFLoader.js';

        let scene, camera, renderer, player, mixer, clock = new THREE.Clock();
        let moveF = 0, turnS = 0, velY = 0, isGrounded = true;
        let animations = {}, activeAction;

        const statusText = document.getElementById('status');
        const pBar = document.getElementById('progress-bar');

        // এরর হ্যান্ডলিং দেখার জন্য স্ক্রিনে মেসেজ দেখাবে
        window.onerror = function(msg) {
            statusText.innerText = "Error: " + msg;
            statusText.style.color = "red";
        };

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // গ্রাউন্ড
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x5a5a4a })
            );
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            const loader = new GLTFLoader();
            // ফাইল পাথ অবশ্যই ./ দিয়ে শুরু করবেন
            loader.load('./Soldier.glb', 
                (gltf) => {
                    player = gltf.scene;
                    player.scale.set(1.5, 1.5, 1.5);
                    scene.add(player);

                    mixer = new THREE.AnimationMixer(player);
                    animations.idle = mixer.clipAction(gltf.animations[0]);
                    animations.walk = mixer.clipAction(gltf.animations[3]);
                    activeAction = animations.idle;
                    activeAction.play();

                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('game-ui').style.display = 'block';
                    setupControls();
                    animate();
                },
                (xhr) => {
                    // প্রগ্রেস বার ফিক্স
                    let percent;
                    if (xhr.lengthComputable) {
                        percent = Math.round((xhr.loaded / xhr.total) * 100);
                    } else {
                        // যদি টোটাল সাইজ না পাওয়া যায় (গিটহাবের ক্ষেত্রে প্রায়ই হয়)
                        percent = Math.min(Math.round((xhr.loaded / 5000000) * 100), 99); 
                    }
                    statusText.innerText = "LOADING MODEL: " + percent + "%";
                    pBar.style.width = percent + "%";
                },
                (err) => {
                    statusText.innerText = "Soldier.glb load failed!";
                }
            );
        }

        // বাকি অ্যানিমেশন এবং কন্ট্রোল কোড আগের মতোই থাকবে...
        function setupControls() {
            const knob = document.getElementById('knob');
            const joy = document.getElementById('joystick');
            joy.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const r = joy.getBoundingClientRect();
                const dx = t.clientX - (r.left + r.width/2);
                const dy = t.clientY - (r.top + r.height/2);
                const d = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
                const a = Math.atan2(dy, dx);
                knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                moveF = -Math.sin(a) * (d / 45);
                turnS = -Math.cos(a) * (d / 45);
                if (activeAction !== animations.walk) {
                    activeAction.fadeOut(0.2);
                    animations.walk.reset().fadeIn(0.2).play();
                    activeAction = animations.walk;
                }
            });
            joy.addEventListener('touchend', () => {
                knob.style.transform = `translate(0,0)`;
                moveF = 0; turnS = 0;
                activeAction.fadeOut(0.2);
                animations.idle.reset().fadeIn(0.2).play();
                activeAction = animations.idle;
            });
            document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGrounded) { velY = 0.2; isGrounded = false; }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if (mixer) mixer.update(dt);
            if (player) {
                player.translateZ(moveF * 0.15);
                player.rotation.y += turnS * 0.05;
                player.position.y += velY;
                if (player.position.y > 0) velY -= 0.01;
                else { player.position.y = 0; velY = 0; isGrounded = true; }
                const offset = new THREE.Vector3(0, 3, -6).applyMatrix4(player.matrixWorld);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
